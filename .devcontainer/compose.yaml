services:
  workspace:
    image: retrace-model-decision-demo:py312
    working_dir: /app
    init: true
    command: ["sleep", "infinity"]
    environment:
      DEMO_ROOT: /app
      DEMO_GENERATED_ROOT: /app/generated
      PYTHONPATH: /app
    volumes:
      - .:/app:cached
    mem_limit: 2g
    cpus: 2
