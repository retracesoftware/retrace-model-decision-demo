name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
    inputs:
      live_model_runs:
        description: Number of independent real-model proofs to run
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "3"
          - "5"
      generate_arm64_artifact:
        description: Generate a reviewed Linux ARM64 recording artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-dap-and-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Build the pinned demo image once
        run: docker compose --file compose.yaml build

      - name: Run source tests and static checks
        run: make test

      - name: Verify the reviewed recording through DAP
        run: |
          DEMO_UID=$(id -u) DEMO_GID=$(id -g) \
            docker compose --file compose.yaml run --rm --no-deps agent \
            python -m scripts.prepare_vscode

      - name: Repeat the bundled replay and DAP proof five times
        run: |
          for run in 1 2 3 4 5; do
            echo "replay_example_run=${run}"
            python3 -m scripts.run_replay_example
          done

      - name: Drain five in-flight recordings across SIGTERM
        run: |
          DEMO_UID=$(id -u) DEMO_GID=$(id -g) \
            docker compose --file compose.yaml run --rm --no-deps agent \
            python -m scripts.verify_foundry_lifecycle --runs 5

      - name: Upload bundled replay and lifecycle proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bundled-replay-and-lifecycle-proof
          path: |
            generated/DEMO_RESULTS.md
            generated/recordings/selected-failure.expected.json
            generated/recordings/selected-failure.proof.json
            generated/lifecycle/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove demo containers
        if: ${{ always() && hashFiles('compose.yaml') != '' }}
        run: docker compose --file compose.yaml down --remove-orphans --volumes

  native-arm64-bundled-replay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Build the native ARM64 image
        run: |
          docker compose --file compose.yaml build
          test "$(docker image inspect retrace-model-decision-demo:py312 \
            --format '{{.Architecture}}')" = "arm64"

      - name: Repeat the ARM64 bundled replay and DAP proof three times
        run: |
          for run in 1 2 3; do
            echo "arm64_replay_example_run=${run}"
            python3 -m scripts.run_replay_example
          done

      - name: Remove demo containers
        if: ${{ always() && hashFiles('compose.yaml') != '' }}
        run: docker compose --file compose.yaml down --remove-orphans --volumes

  live-model-stress:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.live_model_runs != '0') ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-stress]'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEMO_SOURCE_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Install and start Ollama
        run: |
          curl --fail --silent --show-error --location \
            https://ollama.com/install.sh | sh
          sudo systemctl disable --now ollama || true
          OLLAMA_HOST=0.0.0.0:11434 \
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull the pinned model and build once
        run: |
          ollama pull qwen3:1.7b
          docker compose --file compose.yaml build
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            retrace-model-decision-demo:py312 \
            curl --fail --silent http://host.docker.internal:11434/api/tags

      - name: Run independent real-model proofs
        env:
          LIVE_MODEL_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.live_model_runs || '3' }}
        run: |
          mkdir -p stress-artifacts
          for run in $(seq 1 "${LIVE_MODEL_RUNS}"); do
            printf -v run_id "%02d" "${run}"
            echo "live_model_stress_run=${run_id}"
            python3 -m scripts.run_demo --skip-build
            destination="stress-artifacts/run-${run_id}"
            mkdir -p "${destination}/recordings" "${destination}/telemetry"
            cp generated/DEMO_RESULTS.md "${destination}/"
            cp generated/run-summary.json "${destination}/"
            cp generated/recordings/selected-failure.retrace \
              generated/recordings/selected-failure.expected.json \
              generated/recordings/selected-failure.proof.json \
              generated/recordings/selected-failure.code-workspace \
              "${destination}/recordings/"
            cp generated/telemetry/spans.jsonl "${destination}/telemetry/"
          done

      - name: Upload live-model proof reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-model-stress-proof
          path: stress-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Show Ollama diagnostics on failure
        if: ${{ failure() }}
        run: cat /tmp/ollama.log || true

      - name: Remove runner containers
        if: ${{ always() && hashFiles('compose.yaml') != '' }}
        run: docker compose --file compose.yaml down --remove-orphans --volumes

  generate-arm64-reviewed-artifact:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.generate_arm64_artifact
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DEMO_SOURCE_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Install and start native ARM64 Ollama
        run: |
          curl --fail --silent --show-error --location \
            https://ollama.com/install.sh | sh
          sudo systemctl disable --now ollama || true
          OLLAMA_HOST=0.0.0.0:11434 \
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull Qwen and build the native ARM64 image
        run: |
          ollama pull qwen3:1.7b
          docker compose --file compose.yaml build
          test "$(docker image inspect retrace-model-decision-demo:py312 \
            --format '{{.Architecture}}')" = "arm64"
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            retrace-model-decision-demo:py312 \
            curl --fail --silent http://host.docker.internal:11434/api/tags

      - name: Capture and validate a native ARM64 failure
        run: python3 -m scripts.run_demo --skip-build

      - name: Upload the reviewed ARM64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-reviewed-recording-candidate
          path: |
            generated/DEMO_RESULTS.md
            generated/run-summary.json
            generated/recordings/selected-failure.retrace
            generated/recordings/selected-failure.expected.json
            generated/recordings/selected-failure.proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Show Ollama diagnostics on failure
        if: ${{ failure() }}
        run: cat /tmp/ollama.log || true

      - name: Remove runner containers
        if: ${{ always() && hashFiles('compose.yaml') != '' }}
        run: docker compose --file compose.yaml down --remove-orphans --volumes
