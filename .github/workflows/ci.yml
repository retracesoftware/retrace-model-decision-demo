name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
    inputs:
      live_model_runs:
        description: Number of independent real-model proofs to run
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-dap-and-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Build the pinned demo image once
        run: docker compose --file compose.yaml build

      - name: Run source tests and static checks
        run: make test

      - name: Verify the reviewed recording through DAP
        run: |
          DEMO_UID=$(id -u) DEMO_GID=$(id -g) \
            docker compose --file compose.yaml run --rm --no-deps agent \
            python -m scripts.prepare_vscode

      - name: Repeat the offline presentation and DAP proof five times
        run: |
          for run in 1 2 3 4 5; do
            echo "presentation_run=${run}"
            python3 -m scripts.run_presentation
          done

      - name: Drain five in-flight recordings across SIGTERM
        run: |
          DEMO_UID=$(id -u) DEMO_GID=$(id -g) \
            docker compose --file compose.yaml run --rm --no-deps agent \
            python -m scripts.verify_foundry_lifecycle --runs 5

      - name: Upload presentation and lifecycle proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: presentation-and-lifecycle-proof
          path: |
            generated/DEMO_RESULTS.md
            generated/recordings/selected-failure.expected.json
            generated/recordings/selected-failure.proof.json
            generated/lifecycle/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove demo containers
        if: ${{ always() && hashFiles('compose.yaml') != '' }}
        run: docker compose --file compose.yaml down --remove-orphans --volumes

  live-model-stress:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.live_model_runs != '0') ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-stress]'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEMO_SOURCE_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Install and start Ollama
        run: |
          curl --fail --silent --show-error --location \
            https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull the pinned model and build once
        run: |
          ollama pull qwen3:1.7b
          docker compose --file compose.yaml build

      - name: Run independent real-model proofs
        env:
          LIVE_MODEL_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.live_model_runs || '3' }}
        run: |
          mkdir -p stress-artifacts
          for run in $(seq 1 "${LIVE_MODEL_RUNS}"); do
            printf -v run_id "%02d" "${run}"
            echo "live_model_stress_run=${run_id}"
            python3 -m scripts.run_demo --skip-build
            destination="stress-artifacts/run-${run_id}"
            mkdir -p "${destination}/recordings" "${destination}/telemetry"
            cp generated/DEMO_RESULTS.md "${destination}/"
            cp generated/run-summary.json "${destination}/"
            cp generated/recordings/selected-failure.* "${destination}/recordings/"
            cp generated/telemetry/spans.jsonl "${destination}/telemetry/"
          done

      - name: Upload live-model proof reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-model-stress-proof
          path: stress-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Show Ollama diagnostics on failure
        if: ${{ failure() }}
        run: cat /tmp/ollama.log || true

      - name: Remove runner containers
        if: ${{ always() && hashFiles('compose.yaml') != '' }}
        run: docker compose --file compose.yaml down --remove-orphans --volumes
