name: retrace-model-decision-demo

x-demo-service: &demo-service
  image: retrace-model-decision-demo:py312
  platform: linux/amd64
  user: "${DEMO_UID:-0}:${DEMO_GID:-0}"
  working_dir: /app
  init: true
  environment: &demo-environment
    DEMO_ROOT: /app
    DEMO_GENERATED_ROOT: /app/generated
    HOME: /tmp/retrace-demo-home
    PYTHONPATH: /app
  volumes:
    - .:/app:cached
  mem_limit: 1g
  cpus: 1
  networks:
    - demo

services:
  agent:
    <<: *demo-service
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "agent.main"]
    environment:
      <<: *demo-environment
      MODEL_GATEWAY_URL: http://model-gateway:8091
      DEMO_PARENT_SECRET: RETRACE_PARENT_SECRET_MUST_NOT_ENTER_RECORDING
      FOUNDRY_AGENT_NAME: retrace-model-decision-demo
      FOUNDRY_AGENT_VERSION: "1.0"
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      model-gateway:
        condition: service_healthy
      telemetry-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/readiness"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  model-gateway:
    <<: *demo-service
    command: ["python", "-m", "external_world.model_gateway"]
    environment:
      <<: *demo-environment
      PORT: "8091"
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:1.7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8091/health"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

  telemetry-collector:
    <<: *demo-service
    command: ["python", "-m", "external_world.otel_collector"]
    environment:
      <<: *demo-environment
      PORT: "4318"
      OTEL_OUTPUT: /app/generated/telemetry/spans.jsonl
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4318/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

networks:
  demo:
    driver: bridge
